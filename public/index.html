<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Relational Database System</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <!-- ============ TOPBAR ============ -->
  <header class="topbar">
    <div class="brand">
      <img src="/media/logo.png" width="55" alt="SQL Clone logo">
      <div class="brand-text">
        <span class="brand-name">Relational Database</span>
        <span class="brand-sub">Written over node.js</span>
      </div>
    </div>

    <div class="topbar-right">
      <select id="db-picker" class="db-picker" title="Active database"></select>
      <button id="reset-session" class="btn btn--ghost" title="Reset engine session">New session</button>
      <span id="status" class="status status--down">
        <span class="dot"></span><span id="status-text">connecting…</span>
      </span>
    </div>
  </header>

  <!-- ============ MAIN LAYOUT ============ -->
  <main class="layout">

    <!-- ---------- SIDE RAIL (history + tables) ---------- -->
    <aside class="side-rail">

      <!-- History -->
      <section class="rail-section rail-section--history">
        <div class="rail-head">
          <span>History</span>
          <button id="clear-history" class="mini" title="Clear history">×</button>
        </div>
        <div id="history" class="history-list">
          <div class="history-empty">No queries yet</div>
        </div>
      </section>

      <!-- Tables -->
      <section class="rail-section rail-section--tables">
        <div class="rail-head">
          <span>Tables</span>
          <button id="refresh-tables" class="mini" title="Refresh">⟳</button>
        </div>
        <div id="tables" class="table-list">
          <div class="tables-empty">No tables</div>
        </div>
      </section>

    </aside>

    <!-- ---------- QUERY ---------- -->
    <section class="pane pane--query">
      <div class="pane-header">
        <h2>Query</h2>
        <span class="hint">Ctrl / ⌘ + Enter to run · Ctrl+Space for autocomplete</span>
      </div>
      <div class="editor-wrap">
        <textarea id="editor" spellcheck="false" placeholder="SELECT * FROM users;"></textarea>
        <div id="autocomplete" class="autocomplete" hidden></div>
      </div>
      <div class="pane-actions">
        <button id="run" class="btn btn--primary">
          <svg viewBox="0 0 24 24" width="14" height="14"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
          Run
        </button>
        <button id="clear" class="btn">Clear</button>
        <button id="sample" class="btn btn--ghost">Load sample</button>
        <span class="spacer"></span>
        <button id="begin"    class="btn">BEGIN</button>
        <button id="commit"   class="btn">COMMIT</button>
        <button id="rollback" class="btn">ROLLBACK</button>
        <span id="timing" class="timing"></span>
      </div>
    </section>

    <!-- ---------- RESULT ---------- -->
    <section class="pane pane--result">
      <div class="pane-header">
        <h2>Result</h2>
        <div class="pane-header-right">
          <button id="export-csv"  class="mini" title="Export CSV">CSV</button>
          <button id="export-json" class="mini" title="Export JSON">JSON</button>
          <span id="meta" class="hint"></span>
        </div>
      </div>
      <div id="result" class="result">
        <div class="placeholder">Run a query to see results.</div>
      </div>
    </section>
  </main>

  <footer class="credit">
    <span>Developed by <strong>Harshit Rajput.</strong>               <span>V 0.1</span></span>
  </footer>

  <script type="module" src="/app.js"></script>
</body>
</html>
